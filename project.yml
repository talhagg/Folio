name: Folio
options:
  bundleIdPrefix: com.talha
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_LANGUAGE: tr
targets:
  Folio:
    type: application
    platform: macOS
    sources:
      - path: Folio
    info:
      path: Folio/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.talha.folio
            CFBundleURLSchemes: [folio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talha.folio
        PRODUCT_NAME: Folio
        INFOPLIST_KEY_CFBundleDisplayName: Folio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.5"
        CURRENT_PROJECT_VERSION: "7"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: accent
        CODE_SIGN_ENTITLEMENTS: Folio/Folio.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: "\"Folio/Preview Content\""
  FolioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FolioTests
    dependencies:
      - target: Folio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talha.folio.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Folio.app/Contents/MacOS/Folio"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Folio:
    run:
      commandLineArguments:
        "-seedSampleData": true
    build:
      targets:
        Folio: all
        FolioTests: [test]
    test:
      targets:
        - FolioTests
